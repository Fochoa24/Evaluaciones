<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/styles.css">
    <title>Propiedades - Gestión Urbana</title>
</head>
<body class="body">
    <header class="encabezado">
        <a class="logo" href="../index.html">Gestión Urbana</a>
        <nav>
            <a href="../index.html">Inicio</a>
            <a href="./propiedades.html">Propiedades</a>
            <a href="./dashboard.html">Mi Panel</a>
            <a href="./registro.html">Registro</a>
            <a href="./login.html">Iniciar Sesión</a>
        </nav>
    </header>
    
    <main class="seccion">
        <section class="encabezado-catalogo">
            <p class="etiqueta">CATÁLOGO DE INMUEBLES</p>
            <h1>Explora nuestras propiedades disponibles</h1>
        </section>

        <!-- Barra de Filtros (RF5) -->
        <section class="contenedor-filtros">
            <form id="form-filtros" class="bar-filtros">
                <div class="grupo-filtro">
                    <label for="filtro-tipo">Tipo</label>
                    <select id="filtro-tipo" name="tipo">
                        <option value="">Todos</option>
                        <option value="departamento">Departamento</option>
                        <option value="casa">Casa</option>
                        <option value="oficina">Oficina</option>
                        <option value="local">Local Comercial</option>
                    </select>
                </div>

                <div class="grupo-filtro">
                    <label for="filtro-comuna">Comuna</label>
                    <input type="text" id="filtro-comuna" name="comuna" placeholder="Ej: Providencia">
                </div>

                <div class="grupo-filtro">
                    <label for="filtro-precio">Precio Máximo ($)</label>
                    <input type="number" id="filtro-precio" name="precio" min="0" placeholder="Ej: 600000">
                </div>

                <div class="grupo-filtro">
                    <label for="filtro-dormitorios">Dormitorios</label>
                    <select id="filtro-dormitorios" name="dormitorios">
                        <option value="">Cualquiera</option>
                        <option value="1">1+</option>
                        <option value="2">2+</option>
                        <option value="3">3+</option>
                    </select>
                </div>

                <div class="grupo-filtro">
                    <label for="filtro-banos">Baños</label>
                    <select id="filtro-banos" name="banos">
                        <option value="">Cualquiera</option>
                        <option value="1">1+</option>
                        <option value="2">2+</option>
                        <option value="3">3+</option>
                    </select>
                </div>

                <button type="submit" class="boton boton-filtrar">Buscar</button>
                <button type="button" id="btn-limpiar" class="boton boton-secundario">Limpiar</button>
            </form>
            <p id="contador-resultados" class="contador-resultados"></p>
        </section>

        <!-- Las tarjetas se generan desde datos.js -->
        <section class="propiedades-grilla">
            <p id="sin-resultados" class="sin-resultados" hidden>
                No se encontraron propiedades con esos filtros. Prueba ampliando la búsqueda.
            </p>
        </section>
    </main>

    <footer>
        <p>Gestión Urbana Propiedades</p>
    </footer>

    <script src="../js/datos.js"></script>
    <script src="../js/catalogo.js"></script>
</body>
</html>
