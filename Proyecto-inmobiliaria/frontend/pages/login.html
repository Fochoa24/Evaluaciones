<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/styles.css">
    <title>Gestión inmobiliaria</title>
</head>
<body class="body">
    <header class="encabezado">
        <a class="logo" href="../index.html">Gestión Urbana</a>
        <nav>
            <a href="../index.html">Inicio</a>
            <a href="./propiedades.html">Propiedades</a>
        </nav>
    </header>
    
    <main class="login-contenedor">
        <section class="tarjeta-login">
            <h2>Iniciar Sesión</h2>
            <p class="subtitulo-login">Ingresa tus credenciales para acceder a la plataforma</p>

            <form id="form-login" class="formulario-login">
                <div class="campo">
                    <label for="usuario">Usuario, RUT o Correo</label>
                    <input 
                        type="text" 
                        id="usuario" 
                        name="usuario" 
                        placeholder="Ej: 12.345.678-9 o usuario@email.com" 
                        required
                    >
                </div>

                <div class="campo">
                    <label for="password">Contraseña</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="••••••••" 
                        minlength="6"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="perfil">Tipo de Usuario</label>
                    <select id="perfil" name="perfil" required>
                        <option value="" disabled selected>Selecciona tu perfil</option>
                        <option value="cliente">Cliente / Arrendatario</option>
                        <option value="propietario">Propietario</option>
                        <option value="ejecutivo">Ejecutivo Inmobiliario</option>
                        <option value="admin">Administrador</option>
                    </select>
                </div>

                <button type="submit" class="boton boton-login">Ingresar</button>

                <div id="mensaje-login" class="mensaje" role="alert" aria-live="polite"></div>
            </form>
        </section>
    </main>

    <footer>
        <p>Gestión Urbana Propiedades</p>
    </footer>

    <script src="../js/login.js"></script>
</body>
</html>
